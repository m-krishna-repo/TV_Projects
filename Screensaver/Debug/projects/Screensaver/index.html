<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
    <title>Photo Screensaver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #060911;
            font-family: "SamsungOne", "Segoe UI", Arial, sans-serif;
            position: relative;
        }

        #stage {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Ambient vignette overlay for depth */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(
                circle at center,
                rgba(0, 0, 0, 0) 58%,
                rgba(3, 6, 12, 0.68) 100%
            );
        }

        /* Single photo slide */
        .single-slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #131d31 0%, #060911 100%);
            opacity: 0;
            transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .single-slide.active {
            opacity: 1;
        }

        .single-slide.exiting {
            opacity: 0;
            transition: opacity 0.75s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .single-frame {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .single-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform-origin: center center;
            will-change: transform, opacity;
        }

        /* Collage view (2x2 rich cards) */
        .collage-slide {
            position: absolute;
            inset: 0;
            padding: 22px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 18px;
            background: radial-gradient(circle at center, #11192b 0%, #05080f 100%);
            opacity: 0;
            transition: opacity 0.75s ease;
        }

        .collage-slide.active {
            opacity: 1;
        }

        .collage-slide.exiting {
            opacity: 0;
            transition: opacity 0.7s ease;
        }

        .collage-card {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 20px;
            background: #0d1322;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        }

        .collage-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform-origin: center center;
            will-change: transform, opacity;
        }

        /* Motion animations */
        @keyframes zoomInMotion {
            0% {
                transform: scale(1.0);
            }
            100% {
                transform: scale(1.13);
            }
        }

        @keyframes zoomOutMotion {
            0% {
                transform: scale(1.14);
            }
            100% {
                transform: scale(1.0);
            }
        }

        @keyframes cornerToCenterIn {
            0% {
                transform: translate(var(--start-x, -140px), var(--start-y, -110px)) scale(1.08);
            }
            100% {
                transform: translate(0px, 0px) scale(1.03);
            }
        }

        @keyframes centerToOutMotion {
            0% {
                transform: scale(1.02);
            }
            100% {
                transform: scale(1.18);
            }
        }

        .anim-zoom-in {
            animation: zoomInMotion var(--slide-duration, 8000ms) ease-out forwards;
        }

        .anim-zoom-out {
            animation: zoomOutMotion var(--slide-duration, 8000ms) ease-out forwards;
        }

        .anim-corner-center {
            animation: cornerToCenterIn var(--slide-duration, 8000ms) cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-center-out {
            animation: centerToOutMotion var(--slide-duration, 8000ms) ease-in-out forwards;
        }

        /* Subtle HUD badge */
        #status-badge {
            position: fixed;
            bottom: 26px;
            right: 32px;
            z-index: 10;
            padding: 9px 18px;
            border-radius: 999px;
            font-size: 18px;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(9, 14, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #status-badge.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div class="vignette"></div>
    <div id="status-badge"></div>

    <script>
        const SLIDE_DURATION_MS = 8000;
        const TRANSITION_MS = 750;
        const IMAGE_EXTS = [".jpg", ".jpeg", ".png", ".webp"];
        const MOTIONS = ["anim-zoom-in", "anim-zoom-out", "anim-corner-center", "anim-center-out"];

        const CORNERS = [
            { x: "-140px", y: "-110px" }, // Top-left
            { x: "140px",  y: "-110px" }, // Top-right
            { x: "-140px", y: "110px"  }, // Bottom-left
            { x: "140px",  y: "110px"  }  // Bottom-right
        ];

        const stage = document.getElementById("stage");
        const badge = document.getElementById("status-badge");

        let photos = [];
        let paused = false;
        let forcedMode = null; // null = random mix, "single", or "collage"
        let cycleTimer = null;
        let lastMotion = null;

        document.documentElement.style.setProperty("--slide-duration", `${SLIDE_DURATION_MS}ms`);

        function showBadge(text) {
            badge.textContent = text;
            badge.classList.add("show");
            clearTimeout(badge._hideTimer);
            badge._hideTimer = setTimeout(() => badge.classList.remove("show"), 2200);
        }

        function isImageFile(name) {
            const lower = name.toLowerCase();
            return IMAGE_EXTS.some((ext) => lower.endsWith(ext));
        }

        function pickRandomMotion() {
            const pool = MOTIONS.filter((m) => m !== lastMotion);
            const chosen = pool[Math.floor(Math.random() * pool.length)];
            lastMotion = chosen;
            return chosen;
        }

        function applyMotionClass(imgEl, motionClass) {
            if (motionClass === "anim-corner-center") {
                const corner = CORNERS[Math.floor(Math.random() * CORNERS.length)];
                imgEl.style.setProperty("--start-x", corner.x);
                imgEl.style.setProperty("--start-y", corner.y);
            }
            imgEl.classList.add(motionClass);
        }

        function pickRandomPhotos(arr, count) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy.slice(0, Math.min(count, copy.length));
        }

        function clearOldSlides() {
            const currentSlides = stage.querySelectorAll(".single-slide, .collage-slide");
            currentSlides.forEach((el) => {
                el.classList.remove("active");
                el.classList.add("exiting");
                setTimeout(() => {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }, TRANSITION_MS + 50);
            });
        }

        function renderSlide() {
            if (!photos.length || paused) return;

            const useCollage =
                forcedMode === "collage" ||
                (forcedMode === null && photos.length >= 4 && Math.random() < 0.45);

            clearOldSlides();

            const slideEl = document.createElement("div");

            if (useCollage) {
                const selected = pickRandomPhotos(photos, 4);
                slideEl.className = "collage-slide";

                selected.forEach((src) => {
                    const card = document.createElement("div");
                    card.className = "collage-card";

                    const img = document.createElement("img");
                    img.src = src;
                    img.alt = "Screensaver photo";
                    applyMotionClass(img, pickRandomMotion());

                    card.appendChild(img);
                    slideEl.appendChild(card);
                });
            } else {
                const [src] = pickRandomPhotos(photos, 1);
                slideEl.className = "single-slide";

                const frame = document.createElement("div");
                frame.className = "single-frame";

                const img = document.createElement("img");
                img.src = src;
                img.alt = "Screensaver photo";
                applyMotionClass(img, pickRandomMotion());

                frame.appendChild(img);
                slideEl.appendChild(frame);
            }

            stage.appendChild(slideEl);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    slideEl.classList.add("active");
                });
            });
        }

        function loadFromTizenFolder(path = "wgt-package/Photos") {
            return new Promise((resolve, reject) => {
                if (!window.tizen || !tizen.filesystem) {
                    return reject(new Error("Tizen filesystem API unavailable"));
                }

                tizen.filesystem.resolve(
                    path,
                    (dir) => {
                        dir.listFiles(
                            (files) => {
                                const uris = files
                                    .filter((f) => f.isFile && isImageFile(f.name))
                                    .map((f) => f.toURI());
                                resolve(uris);
                            },
                            reject
                        );
                    },
                    reject,
                    "r"
                );
            });
        }

        async function init() {
            try {
                photos = await loadFromTizenFolder("wgt-package/Photos");
            } catch (err) {
                console.warn("Falling back to local preview list:", err);
                photos = ["Photos/Krishnakanth.jpeg"];
            }

            if (!photos.length) {
                stage.innerHTML = `
                    <div class="single-slide active">
                        <p style="color:#ffffff;font-size:36px;">No photos found in Photos folder.</p>
                    </div>`;
                return;
            }

            renderSlide();
            cycleTimer = setInterval(renderSlide, SLIDE_DURATION_MS);
        }

        document.addEventListener("keydown", (e) => {
            if (e.keyCode === 13) {
                paused = !paused;
                showBadge(paused ? "Paused" : "Resumed");
                if (!paused) renderSlide();
            } else if (e.keyCode === 37 || e.keyCode === 39) {
                const modes = [null, "single", "collage"];
                const nextIdx = (modes.indexOf(forcedMode) + 1) % modes.length;
                forcedMode = modes[nextIdx];
                showBadge(`Mode: ${forcedMode || "Random (Single + Collage)"}`);
                renderSlide();
            }
        });

        init();
    </script>
</body>
</html>
