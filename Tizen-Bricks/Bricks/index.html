<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Bricks - Samsung TV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 20%, #1a2436 0%, #0b0f17 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* Top Glass HUD */
        #hud {
            height: 8vh;
            min-height: 60px;
            max-height: 90px;
            padding: 0 3vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
            flex-shrink: 0;
        }

        .hud-stats {
            display: flex;
            gap: 3vw;
            align-items: center;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: clamp(11px, 1.3vh, 14px);
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        .stat-value {
            font-size: clamp(20px, 3vh, 32px);
            font-weight: 700;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
        }

        .hud-controls {
            display: flex;
            gap: 1vw;
        }

        .tv-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid rgba(148, 163, 184, 0.3);
            color: #e2e8f0;
            padding: 0.8vh 1.4vw;
            font-size: clamp(14px, 1.9vh, 20px);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tv-btn.focused, .tv-btn:hover {
            background: #0284c7;
            border-color: #7dd3fc;
            color: #ffffff;
            transform: scale(1.06);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        /* Game Arena */
        #arena-wrapper {
            flex: 1;
            min-height: 0;
            padding: 1.5vh 2vw 1vh 2vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: 100%;
            aspect-ratio: 1680 / 960;
            object-fit: contain;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-left: 10px solid #334155;
            border-right: 10px solid #334155;
            border-top: 10px solid #334155;
            border-bottom: 2px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px 12px 0 0;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), inset 0 0 80px rgba(0, 0, 0, 0.6);
        }

        /* Overlay Screens (Start / Difficulty / Pause / Game Over) */
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.82);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 2vh 4vw;
        }

        #overlay.hidden {
            display: none;
        }

        .game-title {
            font-size: clamp(42px, 7.5vh, 84px);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #38bdf8, #f43f5e, #facc15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2vh;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .subtitle {
            font-size: clamp(18px, 2.5vh, 26px);
            color: #cbd5e1;
            margin-bottom: 4vh;
        }

        .menu-group {
            display: flex;
            gap: 2vw;
            margin-bottom: 3.5vh;
        }

        .menu-btn {
            min-width: 15vw;
            padding: 1.8vh 2.5vw;
            font-size: clamp(18px, 2.4vh, 26px);
            font-weight: 700;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.95);
            border: 3px solid rgba(148, 163, 184, 0.35);
            color: #f1f5f9;
            transition: all 0.15s ease;
        }

        .menu-btn.focused {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-color: #bae6fd;
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        .controls-hint {
            font-size: clamp(14px, 1.8vh, 20px);
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.7);
            padding: 1.2vh 2.2vw;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-stats">
            <div class="stat-box">
                <span class="stat-label">Ball</span>
                <span class="stat-value" id="hud-ball">1 / 3</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="hud-score">00000</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Stage</span>
                <span class="stat-value" id="hud-stage">1</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Mode</span>
                <span class="stat-value" id="hud-mode">EXPERT</span>
            </div>
        </div>

        <div class="hud-controls">
            <button class="tv-btn" id="btn-pause" data-action="pause">Pause</button>
            <button class="tv-btn" id="btn-stop" data-action="stop">Stop</button>
            <button class="tv-btn" id="btn-sound" data-action="sound">Sound: ON</button>
            <button class="tv-btn" id="btn-quit" data-action="quit">Quit</button>
        </div>
    </div>

    <div id="arena-wrapper">
        <canvas id="gameCanvas" width="1680" height="960"></canvas>

        <div id="overlay">
            <div class="game-title" id="overlay-title">MODERN BRICKS</div>
            <div class="subtitle" id="overlay-subtitle">Select Challenge Mode</div>
            <div class="menu-group" id="menu-buttons">
                <button class="menu-btn focused" data-mode="PLAYER">1. Player</button>
                <button class="menu-btn" data-mode="EXPERT">2. Expert</button>
                <button class="menu-btn" data-mode="MASTER">3. Master</button>
            </div>
            <div class="controls-hint">
                Remote: ◀ / ▶ Move Paddle &nbsp;|&nbsp; Enter: Launch / Select &nbsp;|&nbsp; Up / Down: HUD Menu &nbsp;|&nbsp; Return: Quit
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
