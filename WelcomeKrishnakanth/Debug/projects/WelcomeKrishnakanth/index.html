<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
    <title>Hi krishnakanth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: radial-gradient(circle at center, #141e30 0%, #090d16 100%);
            color: #ffffff;
            font-family: "SamsungOne", "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #welcome-container {
            text-align: center;
            opacity: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-photo {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.28);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
            margin-bottom: 34px;
            transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.3s ease;
        }

        h1 {
            font-size: 84px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        #hello-word,
        .glass-name {
            display: inline-block;
            transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.3s ease;
        }

        .glass-name {
            padding: 10px 36px;
            border-radius: 22px;
            background: linear-gradient(
                135deg,
                rgba(56, 189, 248, 0.28) 0%,
                rgba(14, 165, 233, 0.10) 100%
            );
            border: 1.5px solid rgba(125, 211, 252, 0.45);
            box-shadow:
                0 12px 35px rgba(2, 132, 199, 0.35),
                inset 0 1px 1px rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e0f2fe;
            text-shadow:
                0 0 22px rgba(56, 189, 248, 0.75),
                0 2px 4px rgba(0, 0, 0, 0.4);
        }

        #home-screen-btn {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            outline: none;
            padding: 20px 52px;
            font-size: 34px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.6px;
            color: #ffffff;
            background: rgba(56, 189, 248, 0.22);
            border: 2px solid rgba(125, 211, 252, 0.55);
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4);
            transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.3s ease, background-color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        #home-screen-btn:focus,
        #home-screen-btn.focused,
        #home-screen-btn:hover {
            background: rgba(56, 189, 248, 0.42);
            border-color: #ffffff;
            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.45),
                0 16px 36px rgba(2, 132, 199, 0.55);
        }

        /* Slow exit choreography states */
        .profile-photo.exit-up {
            transform: translateY(-700px);
            opacity: 0;
        }

        #hello-word.exit-right {
            transform: translateX(1100px);
            opacity: 0;
        }

        #name-word.exit-left {
            transform: translateX(-1100px);
            opacity: 0;
        }

        #home-screen-btn.exit-down {
            transform: translateY(700px);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="welcome-container">
        <img id="profile-photo" src="Krishnakanth.jpeg" alt="Krishnakanth" class="profile-photo" />
        <h1>
            <span id="hello-word">Hello</span>
            <span id="name-word" class="glass-name">krishnakanth</span>
        </h1>
        <button id="home-screen-btn" type="button" autofocus>Home Screen</button>
    </div>

    <script>
        const photoEl = document.getElementById("profile-photo");
        const helloEl = document.getElementById("hello-word");
        const nameEl = document.getElementById("name-word");
        const homeBtn = document.getElementById("home-screen-btn");

        let isExiting = false;

        function finishToHomeScreen() {
            try {
                if (window.tizen && tizen.application) {
                    tizen.application.getCurrentApplication().exit();
                    return;
                }
            } catch (err) {
                console.error("Failed to exit Tizen app cleanly:", err);
            }

            try {
                window.close();
            } catch (err) {
                console.warn("Window close not permitted in this environment.");
            }
        }

        function goToHomeScreen() {
            if (isExiting) return;
            isExiting = true;
            homeBtn.blur();
            homeBtn.classList.remove("focused");

            // 1. Picture slowly goes up
            requestAnimationFrame(() => {
                photoEl.classList.add("exit-up");
            });

            // 2. "Hello" slowly moves right
            setTimeout(() => {
                helloEl.classList.add("exit-right");
            }, 1150);

            // 3. "krishnakanth" slowly moves left
            setTimeout(() => {
                nameEl.classList.add("exit-left");
            }, 2300);

            // 4. "Home Screen" button slowly goes down
            setTimeout(() => {
                homeBtn.classList.add("exit-down");
            }, 3450);

            // 5. Exit to TV home screen once the button finishes moving down
            setTimeout(() => {
                finishToHomeScreen();
            }, 4950);
        }

        homeBtn.addEventListener("click", goToHomeScreen);

        window.addEventListener("load", () => {
            homeBtn.focus();
            homeBtn.classList.add("focused");
        });

        document.addEventListener("keydown", (e) => {
            if (e.keyCode === 13) {
                e.preventDefault();
                goToHomeScreen();
            }
        });
    </script>
</body>
</html>
